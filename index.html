.calendar-toolbar{display:flex;align-items:center;gap:9px;margin:0 0 12px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}.calendar-toolbar[hidden],#overviewSection[hidden],#taskSection[hidden]{display:none!important}.calendar-toolbar strong{flex:1;text-align:center;font-size:13px}.calendar-nav,.calendar-today{min-width:36px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#4d584e;font-weight:600}.calendar-nav{font-size:19px;line-height:1}.calendar-today{padding:0 11px;font-size:11px}.calendar-nav:hover,.calendar-today:hover{background:#f3f6f1;border-color:#cad6c9}.calendar-agenda{padding:12px;overflow:hidden}.calendar-scroll{overflow-x:auto;overscroll-behavior-x:contain}.calendar-week-grid{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:8px;min-width:820px}.calendar-week-column{min-height:320px;padding:8px;background:#fbfcfa;border:1px solid var(--line);border-radius:12px}.calendar-week-column.is-today{background:#f5f8f3}.calendar-week-column.is-selected{box-shadow:inset 0 0 0 2px var(--green)}.calendar-week-date{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 6px;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left}.calendar-week-date:hover{background:#eef3ec}.calendar-week-date span:first-child{font-size:10px;color:var(--muted)}.calendar-week-date span:last-child{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:650}.calendar-week-column.is-selected .calendar-week-date span:last-child{background:var(--green);color:#fff}.calendar-week-events{display:grid;gap:5px;margin-top:4px}.calendar-empty{display:block;padding:10px 4px;color:#a0a59d;font-size:10px}.calendar-event{display:flex;gap:5px;align-items:flex-start;width:100%;padding:6px 7px;border:0;border-radius:7px;text-align:left;font-size:10px;line-height:1.35;cursor:pointer}.calendar-event:hover{filter:brightness(.9 <body>
<div class="app">
<aside aria-label="主要導覽">
  <div class="brand"><div class="logo">日</div><div><strong>日序</strong><small>DAYFLOW · MAKE SPACE</small></div></div>
  <div><div class="nav-label">工作區</div><nav class="nav">
    <button class="active" data-view="today"><span class="ico">◷</span><span class="nav-text">今日行程</span></button>
    <button data-view="week" type="button"><span class="ico">▦</span><span class="nav-text">週視圖</span></button>
    <button data-view="month" type="button"><span class="ico">▤</span><span class="nav-text">月視圖</span></button>
    <button data-view="tasks"><span class="ico">☑</span><span class="nav-text">任務清單</span></button>
  </nav></div>
  <div><div class="nav-label">管理</div><nav class="nav">
    <button data-view="categories"><span class="ico">◉</span><span class="nav-text">分類管理</span></button>
  </nav></div>
  <div class="side-bottom"><div class="mini-profile"><div class="avatar" id="profileAvatar">訪</div><div><strong id="profileName">訪客</strong><small id="profileEmail">登入以確認身分</small></div></div></div>
</aside>
<main>
  <div class="topbar"><div class="crumb">工作區 <span style="color:#c3c6bf">/</span> <strong style="color:#555c53">今日行程</strong></div><div class="top-actions"><button class="google-signin" id="googleSignIn" type="button"><span class="google-mark" aria-hidden="true">G</span><span id="authButtonLabel">登入</span></button><button class="icon-button" aria-label="通知">♧<span class="dot"></span></button><div class="date-pill" id="topDate"></div></div></div>
  <section class="greeting"><div><div class="eyebrow" id="weekdayLabel">星期四 · 慢慢來，一件一件完成</div><h1>早安，彭安 <span aria-hidden="true">☀</span></h1><p>讓今天有節奏，也留一點空白給自己。</p></div><button class="primary" id="addEvent"><span style="font-size:17px">＋</span> 新增行程</button></section>
  <section class="overview" id="overviewSection">
   <div class="panel day-panel"><div class="panel-head"><h2>十月，2026</h2><span class="head-note">本週</span></div><div class="week-strip" id="weekStrip" aria-label="選擇日期"></div></div>
   <div class="panel progress-panel"><div class="progress-top"><div><h2>今日進度</h2><p>規劃與完成的平衡</p></div><div class="progress-ring" id="ring"><span id="progressPct">63%</span></div></div><div><div class="progress-count"><strong id="doneCount">5</strong><span>／<span id="allCount">8</span> 項任務完成</span></div><div class="progress-line"><span id="progressBar"></span></div><div class="category-legend"><span class="legend"><i></i>生活</span><span class="legend"><i></i>工作</span><span class="legend"><i></i>學習</span><span class="legend"><i></i>個人</span></div></div></div>
  </section>
  <section id="agendaSection"><div class="section-head"><div><h2 id="agendaTitle">今日時間軸</h2><p id="agendaSubtitle">你的行程，一目了然</p></div><div class="view-toggle" id="eventFilters" aria-label="行程分類篩選"><button class="active" data-filter="all">全部</button><button data-filter="life">生活</button><button data-filter="work">工作</button><button data-filter="study">學習</button></div></div><div class="calendar-toolbar" id="calendarToolbar" hidden><button class="calendar-nav" id="calendarPrev" type="button" aria-label="上一週">‹</button><button class="calendar-today" id="calendarToday" type="button">今天</button><strong id="calendarRange"></strong><button class="calendar-nav" id="calendarNext" type="button" aria-label="下一週">›</button></div><div class="panel agenda" id="agenda" aria-live="polite"></div></section>
  <section class="task-section" id="taskSection"><div class="section-head"><div><h2>今日待辦</h2><p>小步前進，也是一種進度</p></div><button class="secondary" id="allTasks">查看全部　→</button></div><div class="task-list" id="taskList"></div><button class="quick-add" id="addTask"><span style="font-size:17px">＋</span> 新增一項待辦</button></section>
</main>
</div>
<div class="modal-backdrop" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">新增行程</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div><form id="eventForm"><div class="fields"><div class="field full"><label for="eventTitle">行程名稱</label><input id="eventTitle" name="title" required maxlength="60" placeholder="例如：專案週會" /></div><div class="field"><label for="eventDate">日期</label><input id="eventDate" name="date" type="date" required /></div><div class="field"><label for="eventCategory">分類</label><select id="eventCategory" name="category"><option value="life">生活</option><option value="work">工作</option><option value="study">學習</option><option value="personal">個人</option></select></div><div class="field"><label for="eventStart">開始時間</label><input id="eventStart" name="start" type="time" required /></div><div class="field"><label for="eventEnd">結束時間</label><input id="eventEnd" name="end" type="time" required /></div><div class="field full"><label for="eventPlace">地點／備註（選填）</label><input id="eventPlace" name="place" maxlength="60" placeholder="輸入地點或提醒" /></div></div><div class="modal-footer"><button type="button" class="secondary" id="cancelModal">取消</button><button type="submit" class="primary">儲存行程</button></div></form></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><div class="modal auth-modal"><div class="modal-head"><div><h2 id="authTitle">登入</h2><p class="auth-hint">選擇登入方式，使用 Firebase 安全驗證。</p></div><button class="close" id="closeAuth" type="button" aria-label="關閉">×</button></div><div class="auth-config-note" id="authConfigNote">使用 Google 或 LINE 帳戶登入。</div><div class="auth-options"><button class="google-signin google-signin-large" id="googleSignInModal" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 帳戶繼續</button><button class="line-signin" id="lineSignInModal" type="button"><span class="line-mark" aria-hidden="true">LINE</span>使用 LINE 帳戶繼續</button></div><p class="auth-error" id="authError" role="status" aria-live="polite"></p></div></div>
<!-- Firebase Authentication setup: see FIREBASE_SETUP.md -->
<script src="./firebase-config.js"></script>
<script type="module" src="./firebase-auth.js"></script>
<script>
const categories={life:{label:'生活',class:'life'},work:{label:'工作',class:'work'},study:{label:'學習',class:'study'},personal:{label:'個人',class:'personal'}};
const iso=(d)=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const today=new Date();today.setHours(0,0,0,0);let selectedDate=iso(today),activeFilter='all',activeView='today',calendarDate=new Date(today);
function readStored(key,fallback){try{const raw=localStorage.getItem(key);if(raw===null)return fallback;const value=JSON.parse(raw);return Array.isArray(value)?value:fallback}catch(error){return fallback}}
let events=readStored('dayflow.events',[
{id:1,date:iso(today),start:'08:30',end:'09:00',title:'晨間整理與咖啡',place:'在家 · 開始新的一天',category:'life'},
{id:2,date:iso(today),start:'09:30',end:'10:30',title:'品牌改版設計討論',place:'線上會議 · 設計團隊',category:'work'},
{id:3,date:iso(today),start:'12:00',end:'13:00',title:'午餐與散步',place:'留一點時間給自己',category:'life'},
{id:4,date:iso(today),start:'14:00',end:'15:30',title:'完成介面設計提案',place:'專注時段',category:'work'},
{id:5,date:iso(today),start:'19:30',end:'20:30',title:'日文課程：旅行會話',place:'線上課程 · 第 8 課',category:'study'}]);
let tasks=readStored('dayflow.tasks',[
{id:1,title:'回覆設計團隊的提案意見',category:'work',due:'今天',done:true},
{id:2,title:'整理週末旅行清單',category:'life',due:'今天',done:true},
{id:3,title:'閱讀《原子習慣》第三章',category:'study',due:'今天',done:true},
{id:4,title:'確認下週會議室預約',category:'work',due:'今天',done:true},
{id:5,title:'繳交線上課程作業',category:'study',due:'今天',done:true},
{id:6,title:'採買咖啡豆與牛奶',category:'life',due:'今天',done:false},
{id:7,title:'整理桌面與下載資料夾',category:'personal',due:'今天',done:false},
{id:8,title:'規劃下週運動時間',category:'life',due:'今天',done:false}]);
const save=()=>{try{localStorage.setItem('dayflow.events',JSON.stringify(events));localStorage.setItem('dayflow.tasks',JSON.stringify(tasks));return true}catch(error){notify('瀏覽器儲存空間無法使用，變更僅暫存於此頁');return false}};
function formatDate(d){return new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'long'}).format(d)}
function dateAtNoon(value){const d=new Date(`${value}T12:00:00`);return Number.isNaN(d.getTime())?new Date(today):d}
function getWeekStart(date){const start=new Date(date);start.setHours(12,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));return start}
function updateAgendaHeading(){const title=document.getElementById('agendaTitle');const subtitle=document.getElementById('agendaSubtitle');if(!title||!subtitle)return;const isToday=selectedDate===iso(today);title.textContent=isToday?'今日時間軸':'行程時間軸';subtitle.textContent=isToday?'你的行程，一目了然':`${formatDate(dateAtNoon(selectedDate))} · 你的行程一目了然`}
function renderCurrentView(){if(activeView==='today'){updateAgendaHeading();drawAgenda()}else drawCalendarView()}
function selectCalendarDate(id,openDayView=false){selectedDate=id;calendarDate=dateAtNoon(id);drawWeek();if(openDayView){setView('today');return}renderCurrentView()}
function stepCalendar(direction){const next=new Date(calendarDate);if(activeView==='week')next.setDate(next.getDate()+direction*7);else next.setDate(1),next.setMonth(next.getMonth()+direction);calendarDate=next;selectedDate=iso(next);drawWeek();drawCalendarView()}
function drawCalendarView(){
 const agenda=document.getElementById('agenda');const range=document.getElementById('calendarRange');const previous=document.getElementById('calendarPrev');const next=document.getElementById('calendarNext');
 agenda.className='panel agenda calendar-agenda';
 const shortDate=d=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(d);
 const dayEvents=id=>events.filter(event=>event.date===id&&(activeFilter==='all'||event.category===activeFilter)).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')));
 const eventButton=(event,id)=>{const category=categories[event.category]||categories.personal;const start=escapeHtml(event.start||'');const title=escapeHtml(event.title||'');return `<button type="button" class="calendar-event ${category.class}" data-calendar-event-date="${id}" aria-label="${escapeHtml(`${start} ${title}`)}"><span class="calendar-event-time">${start}</span><span class="calendar-event-title">${title}</span></button>`};
 previous.setAttribute('aria-label',activeView==='week'?'上一週':'上一月');next.setAttribute('aria-label',activeView==='week'?'下一週':'下一月');
 if(activeView==='week'){
  const start=getWeekStart(calendarDate);const end=new Date(start);end.setDate(start.getDate()+6);range.textContent=`${start.getFullYear()} 年 ${shortDate(start)} – ${shortDate(end)}`;
  const columns=Array.from({length:7},(_,index)=>{const date=new Date(start);date.setDate(start.getDate()+index);const id=iso(date);const list=dayEvents(id);const classes=['calendar-week-column',id===selectedDate?'is-selected':'',id===iso(today)?'is-today':''].filter(Boolean).join(' ');const weekday=new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(date);const items=list.map(event=>eventButton(event,id)).join('')||'<span class="calendar-empty">沒有行程</span>';return `<article class="${classes}"><button type="button" class="calendar-week-date" data-calendar-date="${id}" aria-label="選擇${formatDate(date)}"><span>${weekday}</span><span>${date.getDate()}</span></button><div class="calendar-week-events">${items}</div></article>`}).join('');
  agenda.innerHTML=`<div class="calendar-scroll" role="region" aria-label="週行事曆，可左右滑動"><div class="calendar-week-grid">${columns}</div></div><p class="calendar-hint">點日期選取；點行程可查看當日時間軸。</p>`;
 }else{
  const year=calendarDate.getFullYear();const month=calendarDate.getMonth();range.textContent=`${year} 年 ${month+1} 月`;
  const monthStart=new Date(year,month,1,12);const offset=(monthStart.getDay()+6)%7;const totalDays=new Date(year,month+1,0).getDate();const count=Math.ceil((offset+totalDays)/7)*7;const weekdays=['一','二','三','四','五','六','日'].map(label=>`<div class="calendar-weekday">${label}</div>`).join('');
  const cells=Array.from({length:count},(_,index)=>{const date=new Date(year,month,1-offset+index,12);const id=iso(date);const list=dayEvents(id);const classes=['calendar-month-cell',date.getMonth()!==month?'is-outside':'',id===selectedDate?'is-selected':'',id===iso(today)?'is-today':''].filter(Boolean).join(' ');const visible=list.slice(0,2).map(event=>eventButton(event,id)).join('');const more=list.length>2?`<span class="calendar-more">＋${list.length-2} 更多</span>`:'';return `<div class="${classes}"><button type="button" class="calendar-date-button" data-calendar-date="${id}" aria-label="選擇${formatDate(date)}">${date.getDate()}</button><div class="calendar-month-events">${visible}${more}</div></div>`}).join('');
  agenda.innerHTML=`<div class="calendar-month-scroll"><div class="calendar-month-grid">${weekdays}${cells}</div></div><p class="calendar-hint">點日期選取；點行程可查看當日時間軸。</p>`;
 }
 agenda.querySelectorAll('[data-calendar-date]').forEach(button=>button.addEventListener('click',()=>selectCalendarDate(button.dataset.calendarDate)));
 agenda.querySelectorAll('[data-calendar-event-date]').forEach(button=>button.addEventListener('click',()=>selectCalendarDate(button.dataset.calendarEventDate,true)));
}
function setView(view,resetToToday=false){
 if(resetToToday)selectedDate=iso(today);
 activeView=view;
 const isCalendar=view==='week'||view==='month';
 document.querySelectorAll('.nav button[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));
 document.getElementById('overviewSection').hidden=isCalendar;document.getElementById('taskSection').hidden=isCalendar;document.getElementById('calendarToolbar').hidden=!isCalendar;
 if(isCalendar){calendarDate=dateAtNoon(selectedDate);document.getElementById('agendaTitle').textContent=view==='week'?'本週行程':'月行程';document.getElementById('agendaSubtitle').textContent=view==='week'?'一週安排一覽':'整月行程一覽';drawWeek();drawCalendarView()}
 else{drawWeek();renderCurrentView()}
}
function drawWeek(){const strip=document.getElementById('weekStrip');const ref=dateAtNoon(selectedDate);const start=getWeekStart(ref);strip.innerHTML='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const id=iso(d);const b=document.createElement('button');b.className='day'+(id===selectedDate?' selected':'');b.setAttribute('aria-pressed',id===selectedDate);b.innerHTML=`<span>${new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(d)}</span><span class="num">${d.getDate()}</span>`;b.addEventListener('click',()=>selectCalendarDate(id));strip.appendChild(b)}document.getElementById('topDate').textContent=formatDate(ref);document.querySelector('.day-panel h2').textContent=`${ref.getFullYear()} 年 ${ref.getMonth()+1} 月`}function drawAgenda(){const el=document.getElementById('agenda');el.className='panel agenda';const list=events.filter(x=>x.date===selectedDate&&(activeFilter==='all'||x.category===activeFilter)).sort((a,b)=>a.start.localeCompare(b.start));el.classList.toggle('empty',list.length===0);if(!list.length){el.innerHTML='<div>這天還沒有安排，正好留一點空白。<br><button class="quick-add" style="max-width:220px;margin:14px auto 0" onclick="openModal()">＋ 新增行程</button></div>';return}el.innerHTML=list.map(e=>`<article class="agenda-row"><div class="time">${e.start}<br><span style="color:#b1b5ae">${e.end}</span></div><div class="timeline"><i></i></div><div><p class="event-title">${escapeHtml(e.title)}</p><div class="event-sub">${escapeHtml(e.place||'')}</div></div><div class="event-actions"><span class="tag ${categories[e.category].class}">${categories[e.category].label}</span><button aria-label="刪除${escapeHtml(e.title)}" data-delete="${e.id}">⋯</button></div></article>`).join('');el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('要刪除這筆行程嗎？')){events=events.filter(e=>e.id!==Number(b.dataset.delete));save();drawAgenda();notify('行程已刪除')}}))}function drawTasks(){let list=tasks.filter(t=>!t.hidden);const el=document.getElementById('taskList');el.innerHTML=list.slice(0,6).map(t=>`<article class="panel task ${t.done?'done':''}"><input class="check" type="checkbox" aria-label="完成：${escapeHtml(t.title)}" data-task="${t.id}" ${t.done?'checked':''}><div class="task-body"><p class="task-title">${escapeHtml(t.title)}</p><div class="task-meta"><span class="tag ${categories[t.category].class}">${categories[t.category].label}</span><span class="due ${t.due==='今天'&&!t.done?'urgent':''}">${t.due==='今天'?'◷ ':''}${t.due}</span></div></div></article>`).join('')||'<p style="color:#858a83;font-size:12px">還沒有待辦，享受這段空白吧。</p>';el.querySelectorAll('[data-task]').forEach(c=>c.addEventListener('change',()=>{let t=tasks.find(x=>x.id===Number(c.dataset.task));t.done=c.checked;save();drawTasks();drawProgress()}));drawProgress()}
function drawProgress(){let done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;document.getElementById('doneCount').textContent=done;document.getElementById('allCount').textContent=total;document.getElementById('progressPct').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';document.getElementById('ring').style.background=`conic-gradient(var(--green) 0 ${pct}%,#d9e2d6 ${pct}%)`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(){document.getElementById('eventModal').classList.add('open');document.getElementById('eventDate').value=selectedDate;document.getElementById('eventTitle').focus()}
function closeModal(){document.getElementById('eventModal').classList.remove('open')}
document.getElementById('addEvent').addEventListener('click',openModal);document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('cancelModal').addEventListener('click',closeModal);document.getElementById('eventModal').addEventListener('click',e=>{if(e.target.id==='eventModal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(end<=start){notify('結束時間請晚於開始時間');return}events.push({id:Date.now(),date:f.get('date'),start,end,title:f.get('title').trim(),place:f.get('place').trim(),category:f.get('category')});selectedDate=f.get('date');calendarDate=dateAtNoon(selectedDate);save();drawWeek();renderCurrentView();closeModal();e.target.reset();notify('行程已新增')});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;renderCurrentView()}));
document.getElementById('addTask').addEventListener('click',()=>{let title=prompt('想新增什麼待辦？');if(!title||!title.trim())return;let category=prompt('輸入分類：生活、工作、學習、個人','工作')||'工作';let key={生活:'life',工作:'work',學習:'study',個人:'personal'}[category]||'work';tasks.push({id:Date.now(),title:title.trim(),category:key,due:'今天',done:false});save();drawTasks();notify('待辦已新增')});
document.getElementById('calendarPrev').addEventListener('click',()=>stepCalendar(-1));document.getElementById('calendarNext').addEventListener('click',()=>stepCalendar(1));document.getElementById('calendarToday').addEventListener('click',()=>selectCalendarDate(iso(today)));
document.getElementById('allTasks').addEventListener('click',()=>notify(`目前有 ${tasks.length} 項任務`));document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{const view=button.dataset.view;if(['today','week','month'].includes(view)){setView(view,view==='today');return}document.querySelectorAll('.nav button').forEach(item=>item.classList.toggle('active',item===button));const labels={tasks:'任務清單',categories:'分類管理'};document.getElementById('agendaTitle').textContent=labels[view]||'今日時間軸';notify(`${labels[view]||'此'}檢視即將推出，先為你保留今日總覽`)}));
document.getElementById('weekdayLabel').textContent=`${new Intl.DateTimeFormat('zh-TW',{weekday:'long'}).format(today)} · 慢慢來，一件一件完成`;drawWeek();drawTasks();setView("today");
</script>
</body>
