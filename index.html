<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f8f8f5" />
<title>日序｜個人行程與任務</title>
<style>
:root{--bg:#f7f7f4;--paper:#fff;--ink:#20241f;--muted:#81867f;--line:#e8e9e3;--green:#55795f;--green-dark:#375a43;--green-pale:#e9f0e9;--orange:#c47b4a;--blue:#6282a0;--lav:#8275a4;--shadow:0 12px 35px #24321d0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b598;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);padding:27px 17px;display:flex;flex-direction:column;gap:34px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.logo{width:33px;height:33px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-weight:700;font-size:16px}.brand strong{letter-spacing:-.4px;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:#a2a69e;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#747a72;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button.active{background:var(--green-pale);color:var(--green-dark);font-weight:600}.nav button:hover:not(.active){background:#f7f8f5}.ico{width:17px;height:17px;display:inline-grid;place-items:center;font-size:16px}.side-bottom{margin-top:auto}.mini-profile{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line)}.avatar{width:33px;height:33px;border-radius:50%;background:#efe8da;color:#806d4e;display:grid;place-items:center;font-weight:700}.mini-profile strong{font-size:12px}.mini-profile small{display:block;color:var(--muted);font-size:10px}main{max-width:1500px;width:100%;padding:32px clamp(24px,4vw,64px) 50px;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:12px}.icon-button{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#626960;font-size:17px;position:relative}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#d3784e;top:8px;right:8px}.date-pill{font-size:12px;color:#626960;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:10px}.greeting{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{color:var(--green);font-weight:600;font-size:12px;letter-spacing:.3px}.greeting h1{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:6px 0 7px;font-weight:650}.greeting p{margin:0;color:var(--muted);font-size:13px}.primary{border:0;background:var(--green);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 10px #41644820}.primary:hover{background:var(--green-dark)}.overview{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:20px;align-items:stretch;margin-bottom:25px}.panel{background:var(--paper);border:1px solid #eceee8;border-radius:16px;box-shadow:var(--shadow)}.day-panel{padding:21px 23px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.panel-head h2{font-size:15px;margin:0;font-weight:650}.head-note{font-size:11px;color:var(--muted)}.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:0;background:transparent;border-radius:11px;padding:8px 2px 9px;color:#81867f;display:grid;gap:5px;justify-items:center;font-size:10px}.day .num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;color:#3e443e;font-size:12px}.day.selected{background:#f1f5f0;color:var(--green-dark);font-weight:600}.day.selected .num{background:var(--green);color:white}.day:hover:not(.selected){background:#f7f8f5}.progress-panel{padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:#eff3ec}.progress-top{display:flex;justify-content:space-between;align-items:start}.progress-top h2{font-size:15px;margin:0 0 5px}.progress-top p{font-size:11px;color:#7c8378;margin:0}.progress-ring{width:49px;height:49px;border-radius:50%;background:conic-gradient(var(--green) 0 63%,#d9e2d6 63%);display:grid;place-items:center;position:relative}.progress-ring:before{content:"";position:absolute;inset:6px;background:#eff3ec;border-radius:50%}.progress-ring span{position:relative;font-size:11px;font-weight:700;color:var(--green-dark)}.progress-count{display:flex;align-items:baseline;gap:5px;margin-top:8px}.progress-count strong{font-size:26px;letter-spacing:-1px}.progress-count span{color:#7d8379;font-size:11px}.progress-line{height:5px;background:#dbe3d8;border-radius:4px;overflow:hidden;margin:10px 0 5px}.progress-line span{display:block;width:63%;height:100%;background:var(--green);border-radius:4px}.category-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:10px;color:#687066}.legend{display:flex;align-items:center;gap:5px}.legend i{width:7px;height:7px;border-radius:50%;background:var(--green)}.legend:nth-child(2) i{background:var(--orange)}.legend:nth-child(3) i{background:var(--blue)}.legend:nth-child(4) i{background:var(--lav)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.3px}.section-head p{color:var(--muted);font-size:11px;margin:3px 0 0}.view-toggle{display:flex;gap:3px;background:#edeee9;border-radius:9px;padding:3px}.view-toggle button{border:0;background:transparent;color:#777d74;padding:6px 10px;border-radius:7px;font-size:11px}.view-toggle button.active{background:#fff;color:#39453b;box-shadow:0 1px 4px #0000000c}.agenda{padding:8px 20px}.agenda-row{display:grid;grid-template-columns:60px 14px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:76px;position:relative}.agenda-row:not(:last-child):after{content:"";position:absolute;left:66px;right:0;bottom:0;border-bottom:1px solid #f0f1ed}.time{align-self:start;padding-top:20px;color:#7d837b;font-size:11px;font-variant-numeric:tabular-nums}.timeline{align-self:stretch;display:flex;justify-content:center;position:relative}.timeline:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:#e7eae3}.agenda-row:first-child .timeline:before{top:24px}.agenda-row:last-child .timeline:before{bottom:50%}.timeline i{margin-top:22px;z-index:1;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #edf3ed}.agenda-row:nth-child(2) .timeline i{background:var(--orange);box-shadow:0 0 0 4px #faf0e9}.agenda-row:nth-child(3) .timeline i{background:var(--blue);box-shadow:0 0 0 4px #edf2f6}.agenda-row:nth-child(4) .timeline i{background:var(--lav);box-shadow:0 0 0 4px #f2eff7}.event-title{font-size:13px;font-weight:600;margin:0 0 5px}.event-sub{color:#8a8e87;font-size:10px}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:500;white-space:nowrap}.tag.life{background:#edf3eb;color:#527354}.tag.work{background:#f9eee7;color:#a56c41}.tag.study{background:#ebf1f6;color:#5d7892}.tag.personal{background:#f1eef7;color:#786a9b}.event-actions{display:flex;align-items:center;gap:9px}.event-actions button{border:0;background:none;color:#a2a69f;padding:5px;font-size:15px}.event-actions button:hover{color:var(--green)}.agenda.empty{padding:25px;text-align:center;color:var(--muted)}.task-section{margin-top:28px}.task-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.task{padding:14px 15px;display:flex;gap:11px;align-items:flex-start;min-width:0}.check{appearance:none;flex:0 0 17px;width:17px;height:17px;border:1.5px solid #c9cec6;border-radius:5px;margin:2px 0 0;cursor:pointer;position:relative}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:"✓";position:absolute;color:#fff;font-size:12px;left:2px;top:-1px}.task-body{min-width:0;flex:1}.task-title{font-size:12px;font-weight:600;margin:0 0 8px}.task.done .task-title{text-decoration:line-through;color:#a1a59e}.task-meta{display:flex;align-items:center;justify-content:space-between;gap:5px}.due{font-size:10px;color:#858a83}.due.urgent{color:#bc7149}.quick-add{margin-top:12px;padding:11px 14px;display:flex;align-items:center;gap:9px;border:1px dashed #d9ddd5;border-radius:11px;color:#858a83;background:transparent;width:100%;text-align:left;font-size:12px}.quick-add:hover{border-color:#9eb4a0;color:var(--green-dark);background:#f3f6f1}.modal-backdrop{position:fixed;inset:0;background:#17201966;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(470px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 22px 80px #10191040}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:none;color:#858a83;font-size:21px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#626960;font-weight:600}.field input,.field select{width:100%;border:1px solid #e3e6df;border-radius:9px;padding:10px 11px;background:white;color:var(--ink);font-size:13px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.secondary{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;color:#656b63;font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#283b2d;color:#fff;padding:11px 17px;border-radius:10px;font-size:12px;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{grid-template-columns:75px minmax(0,1fr)}aside{padding:25px 10px;align-items:center}.brand{padding:0}.brand>div:last-child,.nav-label,.nav button .nav-text,.mini-profile>div:last-child{display:none}.nav{width:100%}.nav button{justify-content:center;padding:12px 0}.side-bottom{width:100%}.mini-profile{justify-content:center;padding:14px 0 0}.overview{grid-template-columns:1fr}.progress-panel{min-height:150px}.task-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.app{display:block;padding-bottom:66px}aside{position:fixed;z-index:4;left:0;right:0;bottom:0;top:auto;height:62px;display:block;padding:5px 8px;border-right:0;border-top:1px solid var(--line);box-shadow:0 -5px 20px #1e281508}.brand,.nav-label,.side-bottom{display:none}.nav{height:100%;display:flex;justify-content:space-around;align-items:center}.nav button{width:20%;padding:8px 2px;display:flex;flex-direction:column;gap:2px;font-size:9px;border-radius:8px}.nav button .nav-text{display:block!important}.ico{font-size:15px;height:17px}main{padding:19px 16px 30px}.topbar{margin-bottom:27px}.date-pill{padding:8px 9px;font-size:10px}.greeting{align-items:flex-start}.greeting h1{font-size:26px}.greeting p{font-size:11px}.primary{padding:10px 12px;font-size:11px;white-space:nowrap}.overview{gap:12px;margin-bottom:21px}.day-panel{padding:17px 14px}.progress-panel{padding:17px}.section-head{margin-top:23px}.agenda{padding:5px 12px}.agenda-row{grid-template-columns:47px 12px minmax(0,1fr) auto;gap:8px;min-height:72px}.agenda-row:not(:last-child):after{left:52px}.event-title{font-size:12px}.event-sub{font-size:9px}.tag{font-size:9px;padding:4px 5px}.event-actions{gap:2px}.task-list{grid-template-columns:1fr}.task{padding:13px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside aria-label="主要導覽">
  <div class="brand"><div class="logo">日</div><div><strong>日序</strong><small>DAYFLOW · MAKE SPACE</small></div></div>
  <div><div class="nav-label">工作區</div><nav class="nav">
    <button class="active" data-view="today"><span class="ico">◷</span><span class="nav-text">今日行程</span></button>
    <button data-view="week"><span class="ico">▦</span><span class="nav-text">週視圖</span></button>
    <button data-view="month"><span class="ico">▤</span><span class="nav-text">月視圖</span></button>
    <button data-view="tasks"><span class="ico">☑</span><span class="nav-text">任務清單</span></button>
  </nav></div>
  <div><div class="nav-label">管理</div><nav class="nav">
    <button data-view="categories"><span class="ico">◉</span><span class="nav-text">分類管理</span></button>
  </nav></div>
  <div class="side-bottom"><div class="mini-profile"><div class="avatar">林</div><div><strong>林以安</strong><small>個人工作區</small></div></div></div>
</aside>
<main>
  <div class="topbar"><div class="crumb">工作區 <span style="color:#c3c6bf">/</span> <strong style="color:#555c53">今日行程</strong></div><div class="top-actions"><button class="icon-button" aria-label="通知">♧<span class="dot"></span></button><div class="date-pill" id="topDate"></div></div></div>
  <section class="greeting"><div><div class="eyebrow" id="weekdayLabel">星期四 · 慢慢來，一件一件完成</div><h1>早安，以安 <span aria-hidden="true">☀</span></h1><p>讓今天有節奏，也留一點空白給自己。</p></div><button class="primary" id="addEvent"><span style="font-size:17px">＋</span> 新增行程</button></section>
  <section class="overview">
   <div class="panel day-panel"><div class="panel-head"><h2>十月，2026</h2><span class="head-note">本週</span></div><div class="week-strip" id="weekStrip" aria-label="選擇日期"></div></div>
   <div class="panel progress-panel"><div class="progress-top"><div><h2>今日進度</h2><p>規劃與完成的平衡</p></div><div class="progress-ring" id="ring"><span id="progressPct">63%</span></div></div><div><div class="progress-count"><strong id="doneCount">5</strong><span>／<span id="allCount">8</span> 項任務完成</span></div><div class="progress-line"><span id="progressBar"></span></div><div class="category-legend"><span class="legend"><i></i>生活</span><span class="legend"><i></i>工作</span><span class="legend"><i></i>學習</span><span class="legend"><i></i>個人</span></div></div></div>
  </section>
  <section><div class="section-head"><div><h2>今日時間軸</h2><p id="agendaSubtitle">你的行程，一目了然</p></div><div class="view-toggle" aria-label="行程檢視"><button class="active" data-filter="all">全部</button><button data-filter="life">生活</button><button data-filter="work">工作</button><button data-filter="study">學習</button></div></div><div class="panel agenda" id="agenda" aria-live="polite"></div></section>
  <section class="task-section"><div class="section-head"><div><h2>今日待辦</h2><p>小步前進，也是一種進度</p></div><button class="secondary" id="allTasks">查看全部　→</button></div><div class="task-list" id="taskList"></div><button class="quick-add" id="addTask"><span style="font-size:17px">＋</span> 新增一項待辦</button></section>
</main>
</div>
<div class="modal-backdrop" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">新增行程</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div><form id="eventForm"><div class="fields"><div class="field full"><label for="eventTitle">行程名稱</label><input id="eventTitle" name="title" required maxlength="60" placeholder="例如：專案週會" /></div><div class="field"><label for="eventDate">日期</label><input id="eventDate" name="date" type="date" required /></div><div class="field"><label for="eventCategory">分類</label><select id="eventCategory" name="category"><option value="life">生活</option><option value="work">工作</option><option value="study">學習</option><option value="personal">個人</option></select></div><div class="field"><label for="eventStart">開始時間</label><input id="eventStart" name="start" type="time" required /></div><div class="field"><label for="eventEnd">結束時間</label><input id="eventEnd" name="end" type="time" required /></div><div class="field full"><label for="eventPlace">地點／備註（選填）</label><input id="eventPlace" name="place" maxlength="60" placeholder="輸入地點或提醒" /></div></div><div class="modal-footer"><button type="button" class="secondary" id="cancelModal">取消</button><button type="submit" class="primary">儲存行程</button></div></form></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const categories={life:{label:'生活',class:'life'},work:{label:'工作',class:'work'},study:{label:'學習',class:'study'},personal:{label:'個人',class:'personal'}};
const iso=(d)=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const today=new Date();today.setHours(0,0,0,0);let selectedDate=iso(today),activeFilter='all';
let events=JSON.parse(localStorage.getItem('dayflow.events')||'null')||[
{id:1,date:iso(today),start:'08:30',end:'09:00',title:'晨間整理與咖啡',place:'在家 · 開始新的一天',category:'life'},
{id:2,date:iso(today),start:'09:30',end:'10:30',title:'品牌改版設計討論',place:'線上會議 · 設計團隊',category:'work'},
{id:3,date:iso(today),start:'12:00',end:'13:00',title:'午餐與散步',place:'留一點時間給自己',category:'life'},
{id:4,date:iso(today),start:'14:00',end:'15:30',title:'完成介面設計提案',place:'專注時段',category:'work'},
{id:5,date:iso(today),start:'19:30',end:'20:30',title:'日文課程：旅行會話',place:'線上課程 · 第 8 課',category:'study'}];
let tasks=JSON.parse(localStorage.getItem('dayflow.tasks')||'null')||[
{id:1,title:'回覆設計團隊的提案意見',category:'work',due:'今天',done:true},
{id:2,title:'整理週末旅行清單',category:'life',due:'今天',done:true},
{id:3,title:'閱讀《原子習慣》第三章',category:'study',due:'今天',done:true},
{id:4,title:'確認下週會議室預約',category:'work',due:'今天',done:true},
{id:5,title:'繳交線上課程作業',category:'study',due:'今天',done:true},
{id:6,title:'採買咖啡豆與牛奶',category:'life',due:'今天',done:false},
{id:7,title:'整理桌面與下載資料夾',category:'personal',due:'今天',done:false},
{id:8,title:'規劃下週運動時間',category:'life',due:'今天',done:false}];
const save=()=>{localStorage.setItem('dayflow.events',JSON.stringify(events));localStorage.setItem('dayflow.tasks',JSON.stringify(tasks))};
function formatDate(d){return new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'long'}).format(d)}
function drawWeek(){const strip=document.getElementById('weekStrip');const ref=new Date(`${selectedDate}T12:00:00`);let start=new Date(ref);let dow=(ref.getDay()+6)%7;start.setDate(ref.getDate()-dow);strip.innerHTML='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let id=iso(d);let b=document.createElement('button');b.className='day'+(id===selectedDate?' selected':'');b.setAttribute('aria-pressed',id===selectedDate);b.innerHTML=`<span>${new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(d)}</span><span class="num">${d.getDate()}</span>`;b.addEventListener('click',()=>{selectedDate=id;drawWeek();drawAgenda();document.getElementById('agendaSubtitle').textContent=formatDate(d)+' · 你的行程一目了然'});strip.appendChild(b)}document.getElementById('topDate').textContent=formatDate(new Date(`${selectedDate}T12:00:00`));document.querySelector('.day-panel h2').textContent=`${ref.getFullYear()} 年 ${ref.getMonth()+1} 月`;}
function drawAgenda(){const el=document.getElementById('agenda');let list=events.filter(x=>x.date===selectedDate&&(activeFilter==='all'||x.category===activeFilter)).sort((a,b)=>a.start.localeCompare(b.start));el.classList.toggle('empty',list.length===0);if(!list.length){el.innerHTML='<div>這天還沒有安排，正好留一點空白。<br><button class="quick-add" style="max-width:220px;margin:14px auto 0" onclick="openModal()">＋ 新增行程</button></div>';return}el.innerHTML=list.map(e=>`<article class="agenda-row"><div class="time">${e.start}<br><span style="color:#b1b5ae">${e.end}</span></div><div class="timeline"><i></i></div><div><p class="event-title">${escapeHtml(e.title)}</p><div class="event-sub">${escapeHtml(e.place||'')}</div></div><div class="event-actions"><span class="tag ${categories[e.category].class}">${categories[e.category].label}</span><button aria-label="刪除${escapeHtml(e.title)}" data-delete="${e.id}">⋯</button></div></article>`).join('');el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('要刪除這筆行程嗎？')){events=events.filter(e=>e.id!==Number(b.dataset.delete));save();drawAgenda();notify('行程已刪除')}}))}
function drawTasks(){let list=tasks.filter(t=>!t.hidden);const el=document.getElementById('taskList');el.innerHTML=list.slice(0,6).map(t=>`<article class="panel task ${t.done?'done':''}"><input class="check" type="checkbox" aria-label="完成：${escapeHtml(t.title)}" data-task="${t.id}" ${t.done?'checked':''}><div class="task-body"><p class="task-title">${escapeHtml(t.title)}</p><div class="task-meta"><span class="tag ${categories[t.category].class}">${categories[t.category].label}</span><span class="due ${t.due==='今天'&&!t.done?'urgent':''}">${t.due==='今天'?'◷ ':''}${t.due}</span></div></div></article>`).join('')||'<p style="color:#858a83;font-size:12px">還沒有待辦，享受這段空白吧。</p>';el.querySelectorAll('[data-task]').forEach(c=>c.addEventListener('change',()=>{let t=tasks.find(x=>x.id===Number(c.dataset.task));t.done=c.checked;save();drawTasks();drawProgress()}));drawProgress()}
function drawProgress(){let done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;document.getElementById('doneCount').textContent=done;document.getElementById('allCount').textContent=total;document.getElementById('progressPct').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';document.getElementById('ring').style.background=`conic-gradient(var(--green) 0 ${pct}%,#d9e2d6 ${pct}%)`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(){document.getElementById('eventModal').classList.add('open');document.getElementById('eventDate').value=selectedDate;document.getElementById('eventTitle').focus()}
function closeModal(){document.getElementById('eventModal').classList.remove('open')}
document.getElementById('addEvent').addEventListener('click',openModal);document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('cancelModal').addEventListener('click',closeModal);document.getElementById('eventModal').addEventListener('click',e=>{if(e.target.id==='eventModal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(end<=start){notify('結束時間請晚於開始時間');return}events.push({id:Date.now(),date:f.get('date'),start,end,title:f.get('title').trim(),place:f.get('place').trim(),category:f.get('category')});selectedDate=f.get('date');save();drawWeek();drawAgenda();closeModal();e.target.reset();notify('行程已新增')});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;drawAgenda()}));
document.getElementById('addTask').addEventListener('click',()=>{let title=prompt('想新增什麼待辦？');if(!title||!title.trim())return;let category=prompt('輸入分類：生活、工作、學習、個人','工作')||'工作';let key={生活:'life',工作:'work',學習:'study',個人:'personal'}[category]||'work';tasks.push({id:Date.now(),title:title.trim(),category:key,due:'今天',done:false});save();drawTasks();notify('待辦已新增')});
document.getElementById('allTasks').addEventListener('click',()=>notify(`目前有 ${tasks.length} 項任務`));document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='today'){document.querySelector('.section-head h2').textContent='今日時間軸';drawAgenda()}else{const labels={week:'週視圖',month:'月視圖',tasks:'任務清單',categories:'分類管理'};document.querySelector('.section-head h2').textContent=labels[b.dataset.view];notify(`${labels[b.dataset.view]}檢視即將推出，先為你保留今日總覽`)}}));
document.getElementById('weekdayLabel').textContent=`${new Intl.DateTimeFormat('zh-TW',{weekday:'long'}).format(today)} · 慢慢來，一件一件完成`;drawWeek();drawAgenda();drawTasks();
</script>
</body>
</html>
